Resources:
  StaffUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ${self:service}-${self:provider.stage}-user-pool
      # Staff sign in with a phone number. Changing this property replaces the
      # pool, which deletes every account in it.
      UsernameAttributes:
        - phone_number
      # Empty on purpose: verifying a phone number sends an SMS, which needs an
      # SNS origination identity and costs money per message. Accounts are
      # created by an administrator with the number already marked verified.
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      # No verified email or phone, so a password reset goes through an
      # administrator rather than a self-service message.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  StaffUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ${self:service}-${self:provider.stage}-client
      UserPoolId: !Ref StaffUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      GenerateSecret: false
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # ── Clients (shop customers) ──────────────────────────────────────────────
  CustomersUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ${self:service}-${self:provider.stage}-clients-pool
      # Customers sign in with a phone number too.
      UsernameAttributes:
        - phone_number
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailSubject: 'Bienvenue — vos identifiants de connexion'
          EmailMessage: |
            Bonjour {username},<br/><br/>
            Votre compte a été créé par notre équipe.<br/>
            Voici vos identifiants de connexion temporaires :<br/><br/>
            <b>Email :</b> {username}<br/>
            <b>Mot de passe temporaire :</b> {####}<br/><br/>
            Connectez-vous dès maintenant sur notre boutique en ligne.<br/><br/>
            Cordialement,<br/>
            L'équipe
      Schema:
        - Name: email
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: phone_number
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      # PostConfirmation trigger for self-registrations
      LambdaConfig:
        PostConfirmation: !GetAtt ClientPostConfirmationLambdaFunction.Arn

  CustomersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ${self:service}-${self:provider.stage}-clients-web
      UserPoolId: !Ref CustomersUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      GenerateSecret: false
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # Allow Cognito to invoke Post-Confirmation Lambda
  CustomersUserPoolPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ClientPostConfirmationLambdaFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CustomersUserPool.Arn
