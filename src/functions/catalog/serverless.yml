# One function per group, each answering its four routes. See libs/route.ts.
suppliers:
    handler: src/functions/catalog/suppliers/endpoint.handler
    description: List, create, update and remove suppliers
    events:
      - httpApi: { path: /suppliers, method: GET }
      - httpApi: { path: /suppliers, method: POST }
      - httpApi: { path: '/suppliers/{id}', method: PATCH }
      - httpApi: { path: '/suppliers/{id}', method: DELETE }
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.catalogTableName}
          - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.catalogTableName}/index/*

requests:
    handler: src/functions/catalog/requests/endpoint.handler
    description: List, create, update and remove customer requests
    events:
      - httpApi: { path: /requests, method: GET }
      - httpApi: { path: /requests, method: POST }
      - httpApi: { path: '/requests/{id}', method: PATCH }
      - httpApi: { path: '/requests/{id}', method: DELETE }
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.catalogTableName}
          - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.catalogTableName}/index/*
